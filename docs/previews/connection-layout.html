<style>

flex-direction:column;justify-content:center}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:600}h1{font-size:clamp(34px,3.6vw,54px);letter-spacing:-1px;font-weight:600;margin:24px 0 40px}h2{font-size:30px;font-weight:600;margin:12px 0 28px}h3{font-size:25px;margin:0 0 20px;font-weight:600}p{line-height:1.9;color:var(--muted)}.roles{display:grid;grid-template-columns:1fr 1fr;gap:22px}.role{border:2px solid #c9cdc3;background:#f5f5ef;border-radius:22px;padding:28px;text-align:left;min-height:220px;color:var(--ink);transition:transform .2s,background .2s}.role:first-child{background:var(--wash);border-color:#a9b394}.role:hover{transform:translateY(-3px);background:#e9ede0}.role small{font-size:11px;color:var(--green);letter-spacing:2px}.role b{display:block;font-size:30px;margin:36px 0 10px}.role span{font-size:13px;color:var(--muted)}.role em{float:right;font-style:normal;font-size:24px;color:var(--green)}.primary{border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:white;min-height:48px;padding:11px 24px;font-size:15px;font-weight:600}.primary:hover{background:#343b48;border-color:#343b48}.link{border:0;background:none;color:#414753;font-weight:600;font-size:14px;padding:12px 4px}.link:hover{color:var(--green)}.return-slot{min-height:44px;max-width:1120px;margin:auto;width:100%;padding:0 3%}.return-slot .link{display:flex;align-items:center;gap:9px}.return-slot svg{width:19px;height:19px}.actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:28px}.device{border:2px solid var(--line);border-radius:15px;background:#f4f3ed;padding:23px 25px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin:14px 0}.device strong{font-size:18px}.address{display:block;color:var(--muted);font-size:12px;margin-top:9px}.device-right{display:flex;align-items:center;gap:10px}.state{font-size:12px;color:var(--green);min-width:62px;margin-left:8px}.state.off{color:var(--muted)}.icon{border:0;border-radius:10px;background:transparent;color:#4d5548;width:42px;height:42px;display:grid;place-items:center}.icon:hover{background:#e3e7dc}.icon.delete:hover{background:#f4e7e4;color:#a2463e}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.spinning svg{animation:spin .8s linear infinite}.device-error{font-size:12px;color:#a2463e;margin:6px 0 18px}.flow-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.steps{display:grid;grid-template-columns:repeat(3,1fr);padding:24px 8px;background:#f0f0e9;border:1px solid #e1e2d8;border-radius:20px;margin:6px 0 38px}.step{text-align:center;position:relative}.step:not(:last-child):after{content:"";position:absolute;left:calc(50% + 36px);width:calc(100% - 72px);top:24px;border-top:1px dashed #adb5a1}.ball{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;margin:auto;background:var(--bg);color:#959b8d;font-size:14px;font-weight:600}.step.active .ball{background:var(--ink);color:white;border-color:var(--ink)}.step.done .ball{background:#e3ead7;color:var(--green);border-color:#a7b893}.step label{display:block;font-size:13px;margin-top:13px;color:var(--muted)}.step.active label{color:var(--ink);font-weight:600}.work{max-width:820px;margin:0 auto;min-height:310px}.field{display:block;font-size:12px;color:var(--muted);margin-top:18px}.field input{display:block;width:100%;border:2px solid var(--line);border-radius:11px;background:var(--bg);padding:13px 15px;color:var(--ink);font-size:15px;margin-top:8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.info{padding:20px 23px;background:#f0f0e9;border-radius:14px;margin:14px 0}.info small{display:block;color:var(--muted);font-size:12px;margin-bottom:10px}.info strong{font-weight:500;font-size:18px;overflow-wrap:anywhere}.waiting{color:var(--green);font-size:13px}.mode{display:flex;gap:8px;background:#eeeee7;border-radius:13px;padding:5px;width:max-content;margin:24px 0}.mode button{border:0;border-radius:9px;background:none;color:var(--muted);padding:10px 22px;font-size:14px;font-weight:600}.mode button.active{background:var(--ink);color:white}.board{border:1px solid var(--line);border-radius:20px;background:#f1f2ec;min-height:380px;padding:36px;display:flex;align-items:center;justify-content:center}.cells{display:grid;gap:18px;width:100%;max-width:820px}.cells.horizontal{grid-template-columns:repeat(4,minmax(0,1fr));max-width:none}.cells.vertical{grid-template-columns:minmax(0,1fr);max-width:360px}.cells.columns{grid-template-columns:repeat(2,minmax(0,1fr))}.screen{min-height:150px;border:2px solid #b7c2a6;border-radius:13px;background:var(--bg);padding:20px;position:relative;cursor:grab}.screen:active{cursor:grabbing}.screen.dragging{opacity:.4}.screen.over{outline:3px solid var(--green);outline-offset:3px}.screen b{display:block;font-size:19px}.screen small{display:block;font-size:12px;color:var(--muted);margin-top:12px}.screen .number{position:absolute;right:16px;top:16px;color:#b0b8a5;font-size:12px}.screen .local-mark{display:block;font-size:11px;color:var(--green);margin-top:16px}.sort-hint{font-size:12px;color:var(--muted);margin:18px 0}.layout-select{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:13px}.layout-select select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}footer{grid-column:1/-1;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--muted);font-size:10px}.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:12px;padding:13px 22px;font-size:13px;z-index:10}.enter{animation:enter .3s ease-out both}.leave{opacity:0;transform:translateY(-10px);transition:opacity .15s,transform .15s;pointer-events:none}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1000px){.app{grid-template-columns:160px minmax(0,1fr)}main{padding:24px}.inner{padding-left:0;padding-right:0}.cells.horizontal{gap:10px}.screen{padding:15px}.screen b{font-size:15px}}@media(max-width:700px){.app{grid-template-columns:1fr;margin:0}.demo{height:auto;min-height:44px;gap:10px;padding:8px 12px;flex-wrap:wrap}aside{display:none}main{padding:20px}.roles{gap:12px}.role{padding:20px;min-height:200px}.role b{font-size:25px}.role span{font-size:12px}.fields{grid-template-columns:1fr}.device{padding:18px 14px;gap:8px}.device-right{gap:1px}.icon{width:34px}.board{padding:18px}.cells.horizontal{grid-template-columns:repeat(4,minmax(100px,1fr))}.board{overflow-x:auto;justify-content:start}.screen{min-height:130px}.state{min-width:48px;font-size:11px}.flow-head h2{font-size:26px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.layout-inner{max-width:none;padding:12px 0 24px}.layout-board{height:clamp(380px,58vh,780px);width:100%;position:relative;overflow:hidden;border:1px solid var(--line);background-color:var(--bg);background-image:linear-gradient(#e0d8cf55 1px,transparent 1px),linear-gradient(90deg,#e0d8cf55 1px,transparent 1px);background-size:24px 24px;touch-action:none}#layoutWorld{position:absolute;left:0;top:0;transform-origin:0 0}.layout-board .screen{position:absolute;width:190px;height:132px;min-height:0;border:1.5px solid var(--ink);border-radius:0;background:var(--bg);padding:16px 12px 12px;box-shadow:none;user-select:none;touch-action:none}.layout-board .screen b{font-size:14px;font-weight:600}.layout-board .screen small{font-size:11px;margin-top:7px;color:var(--muted)}.layout-board .local-mark{position:absolute;bottom:12px;font-size:10px;color:var(--muted);margin:0}.screen-strip{position:absolute;top:0;left:0;right:0;height:4px;background:#afdc3c}.layout-board .screen.moving{z-index:3;opacity:.85;cursor:grabbing}.drop-ghost{position:absolute;width:190px;height:132px;border:2px dashed var(--green);background:#afdc3c20;z-index:0;pointer-events:none}.layout-foot{display:flex;justify-content:space-between;padding-top:16px;color:var(--muted);font-size:12px}

.screen-slot{position:absolute;border:1px dashed #a4ac99;background:transparent;pointer-events:none}.layout-board .screen{width:240px;height:135px;padding:12px 8px 8px;z-index:1}.layout-board .screen b{font-size:11px}.layout-board .screen small{font-size:8px;margin-top:5px}.layout-board .local-mark{bottom:8px;font-size:8px}.screen-strip{height:3px}.drop-ghost{width:240px;height:135px;z-index:2}

/* 通行边只标在真实屏幕轮廓上，虚线占位不承担通行标识。 */
.screen-strip{display:none}.cross-edge{position:absolute;display:block;background:#7d954d;pointer-events:none;z-index:5;transition:background .16s,box-shadow .16s}.edge-top,.edge-bottom{left:-1.5px;right:-1.5px;height:2px}.edge-top{top:-1.5px}.edge-bottom{bottom:-1.5px}.edge-left,.edge-right{top:-1.5px;bottom:-1.5px;width:2px}.edge-left{left:-1.5px}.edge-right{right:-1.5px}.cross-edge.highlight{background:#587b25;box-shadow:0 0 0 1px #587b25}.layout-board:has(.screen:hover) .screen:has(.cross-edge.highlight),.layout-board:has(.screen:focus) .screen:has(.cross-edge.highlight){z-index:2}

.layout-board .local-name{color:#58790f}.cross-edge{background:#617b34;transition:none}.cross-edge.highlight{background:#617b34;box-shadow:none}.edge-top,.edge-bottom{height:2.5px}.edge-left,.edge-right{width:2.5px}.edge-tip{position:absolute;z-index:10;pointer-events:none;background:#1b2130;color:#fff;border-radius:8px;padding:9px 13px;font-size:13px;white-space:nowrap}.layout-board:has(.screen:hover) .screen:has(.cross-edge.highlight),.layout-board:has(.screen:focus) .screen:has(.cross-edge.highlight){z-index:1}

.crayon-arrow{pointer-events:stroke;color:#7d885d}.crayon-main{fill:none;stroke:currentColor;stroke-width:4.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}.crayon-grain{fill:none;stroke:var(--bg);stroke-width:.8;stroke-dasharray:1.7 2.2 4 1.3;stroke-linecap:round;opacity:.65;pointer-events:none}.connection-channel:hover .crayon-arrow,.connection-channel:focus .crayon-arrow{color:#566a37}.connection-channel:focus .crayon-main{stroke-width:5.5}

<body><div class="demo"><span>连接与排列交互稿</span><div><button onclick="reset(false)">无配对设备</button><button onclick="reset(true)">已有配对设备</button><button onclick="showLayout()">屏幕排列</button></div></div>
<div class="app"><header class="top"><div class="brand">NekoBridge<small>1.00</small></div><span class="top-status" id="topStatus">1 台在线</span></header><aside><div class="local"><small>LOCAL DEVICE</small><strong>我的电脑</strong></div><nav><button id="navConnection" class="active" onclick="openConnection()"><span>01</span>连接</button><button id="navLayout" onclick="showLayout()"><span>02</span>屏幕排列</button><button onclick="notify('本稿不调整设置页')"><span>03</span>设置</button></nav></aside><main><div class="page-title"><small id="pageNo">01</small><span id="pageTitle">连接</span></div><div class="return-slot"><button class="link hidden" id="backDevices" onclick="exitGuide()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg>返回设备列表</button></div><section id="view" class="view"></section></main><footer><span>局域网 · TLS 配对</span><span>HTML PREVIEW</span></footer></div><div class="toast hidden" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const trash='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15M9 6.5V4.8c0-.7.5-1.3 1.2-1.3h3.6c.7 0 1.2.6 1.2 1.3v1.7M6.5 6.5l.8 12.2c.1 1  .8 1.8 1.8 1.8h5.8c1 0 1.7-.8 1.8-1.8l.8-12.2M10 10v6.5M14 10v6.5"/></svg>';
const reload='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.3 9a7.7 7.7 0 1 0 .2 5.5M19.3 4.5V9h-4.5"/></svg>';
let devices=[],page='devices',role=null,stage=1,pairing=false,toastTimer,transitionTimer,generation=0;
let screens=[{id:'a',name:'本机',res:'3840 × 2160'},{id:'b',name:'电脑 B',res:'1920 × 1080'},{id:'c',name:'电脑 C',res:'2560 × 1440'},{id:'d',name:'电脑 D',res:'1920 × 1200'}];
screens.forEach((s,i)=>{s.col=i;s.row=0});

function notify(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2300)}
function reset(paired){generation++;clearTimeout(transitionTimer);devices=paired?[{id:1,name:'电脑 B',address:'192.168.1.20:24870',online:true},{id:2,name:'电脑 C',address:'192.168.1.30:24870',online:false}]:[];role=null;pairing=false;page=paired?'devices':'intro';render()}
function go(next){generation++;page=next;clearTimeout(transitionTimer);if(reduced){render();return}$('#view').classList.add('leave');transitionTimer=setTimeout(()=>{$('#view').classList.remove('leave');render()},150)}
function openConnection(){go(devices.length?'devices':'intro')}
function exitGuide(){pairing=false;role=null;stage=1;go(devices.length?'devices':'intro')}
function add(){role=null;pairing=false;stage=1;go('intro')}
function choose(r){role=r;stage=1;pairing=false;go('flow')}
function backRole(){pairing=false;stage=1;role=null;go('intro')}
function advance(n){stage=n;go('flow')}
function connected(){pairing=false;if(!devices.some(d=>d.id===3))devices.push({id:3,name:'新设备',address:'192.168.1.40:24870',online:true});stage=3;go('flow')}
function reconnect(id){const d=devices.find(d=>d.id===id);if(!d||d.busy)return;d.busy=true;render();setTimeout(()=>{if(!devices.includes(d))return;d.busy=false;d.online=true;render()},1100)}
function removeDevice(id){const d=devices.find(d=>d.id===id);if(!d||!confirm('移除 '+d.name+' 的配对？再次连接需要重新配对。'))return;devices=devices.filter(d=>d.id!==id);if(!devices.length)page='intro';render()}
function deviceCards(){return devices.map(d=>'<div class="device"><div><strong>'+d.name+'</strong><span class="address">'+d.address+'</span></div><div class="device-right">'+'<button class="icon '+(d.busy?'spinning':'')+'" title="重新连接" aria-label="重新连接 '+d.name+'" onclick="reconnect('+d.id+')" '+(d.busy?'disabled':'')+'>'+reload+'</button>'+'<button class="icon delete" title="移除设备" aria-label="移除 '+d.name+'" onclick="removeDevice('+d.id+')">'+trash+'</button><span class="state '+(d.online?'':'off')+'">'+(d.busy?'连接中':d.online?'● 已连接':'○ 未连接')+'</span></div></div>').join('')}
function render(){const layout=page==='layout';$('#pageNo').textContent=layout?'02':'01';$('#pageTitle').textContent=layout?'屏幕排列':'连接';$('#navConnection').classList.toggle('active',!layout);$('#navLayout').classList.toggle('active',layout);$('#backDevices').classList.toggle('hidden',!devices.length||!['intro','flow'].includes(page));$('#topStatus').textContent=devices.filter(d=>d.online).length+' 台在线';let html='';
if(page==='intro')html='<div class="inner intro-inner"><div class="eyebrow">NEKOBRIDGE / CONNECT</div><h1>这台主机是作为…</h1><div class="roles"><button class="role" onclick="choose(\'controller\')"><small>01 / CONTROL</small><b>控制端</b><span>键鼠插在这台主机上</span><em>↗</em></button><button class="role" onclick="choose(\'receiver\')"><small>02 / RECEIVE</small><b>被控端</b><span>使用另一台主机的键鼠</span><em>↗</em></button></div></div>';
if(page==='devices')html='<div class="inner"><div class="eyebrow">CONNECTED DEVICES</div><h1>'+(devices.some(d=>d.online)?'设备已连接。':'已配对设备。')+'</h1>'+deviceCards()+'<div class="actions"><button class="primary" onclick="add()">连接新设备</button><button class="link" onclick="showLayout()">调整屏幕排列 ↗</button></div></div>';
if(page==='flow'){const labels=role==='controller'?['准备对方主机','填写连接信息','连接完成']:['开启配对','提供连接信息','连接完成'];let work='';if(stage===1)work='<h3>'+(role==='controller'?'先在另一台主机开启配对':'开启配对')+'</h3><p>'+(role==='controller'?'打开对方的 NekoBridge，选择“被控端”，点击“开启配对”。':'开启后会显示本机地址和安全密钥。配对开放五分钟。')+'</p><div class="actions"><button class="primary" onclick="'+(role==='controller'?'advance(2)':'pairing=true;advance(2)')+'">'+(role==='controller'?'对方已开启，下一步 →':'开启配对 →')+'</button></div>';
if(stage===2&&role==='receiver')work='<h3>把连接信息填到控制端</h3><div class="info"><small>本机地址</small><strong>192.168.1.10:24870</strong></div><div class="info"><small>安全密钥</small><strong>7F3A 82BC 19D0 4E65</strong></div><p class="waiting">等待控制端连接 · 剩余 04:59</p><div class="actions"><button class="primary" onclick="notify(\'复制操作仅作预览\')">复制连接信息</button><button class="link" onclick="connected()">模拟收到连接 →</button></div>';
if(stage===2&&role==='controller')work='<h3>连接对方主机</h3><button class="primary" onclick="document.getElementById(\'address\').value=\'192.168.1.40:24870\';notify(\'已选中附近的新设备\')">查找附近设备</button><form onsubmit="event.preventDefault();if(!document.getElementById(\'address\').value.trim()){notify(\'请填写对方地址\');return}connected()"><div class="fields"><label class="field">对方地址<input id="address" autocomplete="off"></label><label class="field">安全密钥<input autocomplete="off"></label></div><div class="actions"><button class="primary" type="submit">连接 →</button><button class="link" type="button" onclick="advance(1)">上一步</button></div></form>';
if(stage===3)work='<h3>连接成功</h3><div class="info"><strong>新设备</strong></div><div class="actions"><button class="primary" onclick="showLayout()">调整屏幕排列 ↗</button><button class="primary" onclick="exitGuide()">完成</button></div>';
html='<div class="inner"><div class="flow-head"><div><div class="eyebrow">'+(role==='controller'?'CONTROLLER':'RECEIVER')+'</div><h2>'+(role==='controller'?'控制端':'被控端')+'</h2></div><button class="link" onclick="backRole()">重新选择角色</button></div><div class="steps">'+labels.map((l,i)=>'<div class="step '+(i+1===stage?'active':i+1<stage?'done':'')+'"><div class="ball">'+(i+1<stage?'✓':'0'+(i+1))+'</div><label>'+l+'</label></div>').join('')+'</div><div class="work">'+work+'</div></div>'}
if(layout){html='<div class="inner layout-inner"><div class="layout-board" id="layoutBoard"><div id="layoutWorld"><div id="dropGhost" class="drop-ghost hidden"></div>'+screens.map(s=>'<div class="screen-slot" data-slot="'+s.id+'"></div><div class="screen" data-id="'+s.id+'" tabindex="0" aria-label="'+s.name+'，'+s.res+'"><b class="'+(s.id==='a'?'local-name':'')+'">'+s.name+'</b><small>'+s.res+'</small><span class="local-mark">'+(s.id==='a'?'本机 · 虚拟桌面':'远端设备')+'</span></div>').join('')+'</div><svg id="connectionLayer" class="connection-layer" aria-label="设备穿屏通道"></svg><div id="edgeTip" class="edge-tip hidden" role="status"></div></div><div class="layout-foot"><span>双向箭头表示穿屏通道 · 虚线为设备占位</span><span>4 台设备</span></div></div>'}

$('#view').innerHTML=html;$('#view').classList.remove('enter');void $('#view').offsetWidth;$('#view').classList.add('enter');if(layout){bindDrag()}}
function showLayout(){pairing=false;go('layout')}
function bindDrag(){
 const board=$('#layoutBoard'),world=$('#layoutWorld'),ghost=$('#dropGhost');
 let unitX=240,unitY=135,ox=0,oy=0,scale=1,drag=null;
 const tip=$('#edgeTip');
 const svg=$('#connectionLayer'),ns='http://www.w3.org/2000/svg';
 function clearEdges(){tip.classList.add('hidden')}
 function node(tag,attrs){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
 function drawConnections(){
  svg.replaceChildren();svg.setAttribute('viewBox','0 0 '+board.clientWidth+' '+board.clientHeight);
  function rect(s){const el=world.querySelector('[data-id="'+s.id+'"]');return {x:ox+s.col*unitX*scale,y:oy+s.row*unitY*scale,w:parseFloat(el.style.width)*scale,h:parseFloat(el.style.height)*scale}}
  screens.filter(s=>s.online!==false).forEach(a=>{
   [[1,0],[0,1]].forEach(([dx,dy])=>{
    const b=screens.find(b=>b.col===a.col+dx&&b.row===a.row+dy&&b.online!==false);if(!b)return;
    const ar=rect(a),br=rect(b);let x1,y1,x2,y2;
    if(dx){y1=y2=Math.max(ar.y,br.y)+Math.min(ar.h,br.h)*.5;x1=ar.x+ar.w;x2=br.x}
    else{x1=x2=Math.max(ar.x,br.x)+Math.min(ar.w,br.w)*.5;y1=ar.y+ar.h;y2=br.y}
    const cx=(x1+x2)/2,cy=(y1+y2)/2;
    const g=node('g',{class:'connection-channel',tabindex:'0',role:'img','aria-label':a.name+'与'+b.name+'可双向穿屏'});
    const title=node('title',{});title.textContent=a.name+' ↔ '+b.name;g.append(title);
    const length=Math.max(42,Math.min(160,Math.hypot(x2-x1,y2-y1)+24)),half=length/2;
    const pencil=node('g',{class:'crayon-arrow',transform:'translate('+cx+' '+cy+')'+(dy?' rotate(90)':'')});
    const stroke='M '+(-half)+' 1 Q -6 -1 '+half+' -1 M '+(-half+11)+' -10 L '+(-half)+' 1 L '+(-half+11)+' 11 M '+(half-11)+' -11 L '+half+' -1 L '+(half-10)+' 10';
    pencil.append(node('path',{class:'crayon-main',d:stroke}));
    pencil.append(node('path',{class:'crayon-grain',d:'M '+(-half+2)+' 3 Q 0 1 '+(half-2)+' 1 M '+(-half+10)+' -8 L '+(-half+2)+' 1 L '+(-half+11)+' 9 M '+(half-10)+' -9 L '+(half-2)+' -1 L '+(half-9)+' 8'}));
    g.append(pencil);
    function showTip(){tip.textContent=a.name+(dy?' ↕ ':' ↔ ')+b.name;tip.classList.remove('hidden');tip.style.left=Math.max(10,Math.min(cx+24,board.clientWidth-tip.offsetWidth-12))+'px';tip.style.top=Math.max(10,Math.min(cy+20,board.clientHeight-tip.offsetHeight-12))+'px'}
    g.onpointerenter=showTip;g.onpointerleave=clearEdges;g.onfocus=showTip;g.onblur=clearEdges;
    svg.append(g);
   });
  });
 }
 function fit(){
  const minC=Math.min(...screens.map(s=>s.col)),maxC=Math.max(...screens.map(s=>s.col));
  const minR=Math.min(...screens.map(s=>s.row)),maxR=Math.max(...screens.map(s=>s.row));
  const w=(maxC-minC+1)*unitX,h=(maxR-minR+1)*unitY;
  scale=Math.max(.1,Math.min(2.6,(board.clientWidth-96)/w,(board.clientHeight-96)/h));
  ox=(board.clientWidth-w*scale)/2-minC*unitX*scale;oy=(board.clientHeight-h*scale)/2-minR*unitY*scale;
  world.style.transform='translate('+ox+'px,'+oy+'px) scale('+scale+')';
  screens.forEach(s=>{
   const el=world.querySelector('[data-id="'+s.id+'"]'),slot=world.querySelector('[data-slot="'+s.id+'"]');
   const [width,height]=s.res.split('×').map(v=>Number(v.trim()));
   el.style.width=width/3840*unitX+'px';el.style.height=height/2160*unitY+'px';
   el.style.left=slot.style.left=s.col*unitX+'px';el.style.top=slot.style.top=s.row*unitY+'px';
   slot.style.width=unitX+'px';slot.style.height=unitY+'px';
   slot.classList.toggle('hidden',width===3840&&height===2160);
  });
  clearEdges();drawConnections();
 }
 function place(s,col,row){const other=screens.find(t=>t!==s&&t.col===col&&t.row===row);if(other){other.col=s.col;other.row=s.row}s.col=col;s.row=row}
 world.querySelectorAll('.screen').forEach(el=>{
  el.onpointerleave=clearEdges;
  el.onblur=clearEdges;
  el.onpointerdown=e=>{if(e.button!==0)return;clearEdges();svg.classList.add('hidden');e.preventDefault();el.focus({preventScroll:true});const s=screens.find(t=>t.id===el.dataset.id);drag={s,el,x:e.clientX,y:e.clientY,col:s.col,row:s.row};el.setPointerCapture(e.pointerId);el.classList.add('moving');ghost.classList.remove('hidden');ghost.style.left=s.col*unitX+'px';ghost.style.top=s.row*unitY+'px'};
  el.onpointermove=e=>{if(!drag)return;if(drag.el!==el)return;const dx=(e.clientX-drag.x)/scale,dy=(e.clientY-drag.y)/scale;el.style.left=drag.s.col*unitX+dx+'px';el.style.top=drag.s.row*unitY+dy+'px';drag.col=Math.round(drag.s.col+dx/unitX);drag.row=Math.round(drag.s.row+dy/unitY);ghost.style.left=drag.col*unitX+'px';ghost.style.top=drag.row*unitY+'px'};
  const finish=(e,cancel)=>{if(!drag||drag.el!==el)return;const d=drag;drag=null;svg.classList.remove('hidden');if(!cancel)place(d.s,d.col,d.row);el.classList.remove('moving');ghost.classList.add('hidden');if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);fit()};
  el.onpointerup=e=>finish(e,false);el.onpointercancel=e=>finish(e,true);el.onlostpointercapture=e=>{if(drag)finish(e,true)};
  el.onkeydown=e=>{const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!delta)return;e.preventDefault();const s=screens.find(t=>t.id===el.dataset.id);place(s,s.col+delta[0],s.row+delta[1]);fit()};
 });
 fit();const observer=new ResizeObserver(()=>{if(!board.isConnected){observer.disconnect();return}if(!drag)fit()});observer.observe(board);
}

reset(true);
</script></body></html>
